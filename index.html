<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chi Flow: draw your bedroom, watch chi flow like a wind tunnel, and get a Western feng shui report." />
    <title>Chi Flow · Feng Shui Bedroom Simulator</title>
    <meta property="og:title" content="Chi Flow · Feng Shui Bedroom Simulator" />
    <meta property="og:description" content="Draw your bedroom, watch chi flow through it like a wind tunnel, and get a feng shui report with one-click fixes." />
    <meta name="theme-color" content="#f6f1ea" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23c06a45'/><path d='M50 6a44 44 0 0 1 0 88a22 22 0 0 1 0-44a22 22 0 0 0 0-44z' fill='%23f6f1ea'/></svg>" />
  </head>
  <body>
    <div class="app">
      <header id="toolbar" class="toolbar"></header>
      <aside class="panel panel-left">
        <div id="palette" aria-label="Furniture palette"></div>
        <div id="sim-panel" aria-label="Simulation controls" hidden></div>
      </aside>
      <main class="canvas-area">
        <!-- The flow layer (heatmap + particles) sits underneath the Konva editor layer. -->
        <canvas id="flow-canvas" class="flow-canvas"></canvas>
        <div id="canvas-host" class="canvas-host"></div>
        <div id="sim-banner" class="sim-banner" role="status" hidden></div>
        <div id="fix-bar" class="fix-bar" role="status" hidden></div>
      </main>
      <aside class="panel panel-right">
        <section id="score-card" class="score-card" aria-label="Feng shui score" aria-live="polite"></section>
        <div class="panel-tabs" role="tablist" aria-label="Right panel">
          <button type="button" role="tab" data-tab="report">Report <span id="report-tab-count" class="tab-count"></span></button>
          <button type="button" role="tab" data-tab="properties">Properties</button>
        </div>
        <div id="report-panel" role="tabpanel" aria-label="Feng shui report"></div>
        <div id="properties" role="tabpanel" aria-label="Properties" hidden></div>
      </aside>
      <footer class="statusbar">
        <span class="shortcuts">Drag to move · Shift while dragging = no snapping · R rotate · ⌫ delete · ⌘/Ctrl+D duplicate · Arrows nudge · Esc deselect</span>
        <span class="disclaimer-short">Feng shui is a traditional practice; this tool is for design inspiration, not a scientific or medical claim.</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
